# HBM 可复制的自包含配置（schema 3）：选择协议基准 + 主参数 + 可选覆盖。
# 组织/Timing 默认值统一由 src/dram/profiles.cpp 提供；本文件不再复制整张时序表。
# 直接修改当前 [standard.*.organization] 即可探索，联动项自动计算，不需要 developer.cfg。
# 可信度/自动推导/单位说明见 文档/cfg指南.md；不是厂商器件模型。

[meta]
schema_version = 3  # 当前配置语法；schema 1/2 输入也执行同一套参数联动与一致性检查

[model]
name = hbm_exploration  # 当前模型或 preset 的可读名称，可按实验用途自定义
base_standard = hbm4  # 基础协议标准；HBM 可选 hbm3/hbm4，LPDDR 可选 lpddr5/lpddr6

[validation]
mode = exploratory  # 可信度模式；可选 exploratory、standard、device
strict_timing_table = false  # 是否拒绝仍需器件校准的 Timing 项；false 仍检查基本有效性，true 不等于 JEDEC 完整认证

[memory_system]
stack_count = 1  # 独立存储 Stack/器件实例数量，必须为正整数，可按系统规模设置
stack_mapping = interleaved  # 系统地址到 Stack 的映射；可选 interleaved 或 blocked
stack_interleave_bytes = 256  # 多 Stack 条带粒度，单位 Byte，必须是 line_size 的整数倍
stack_ingress_buffer_size = 256  # 每个 Stack 的入口队列深度，按并发压力设为正整数
stack_dispatch_width = 4  # 每个 Stack 每拍最多分发的事务数，按目标带宽设定
stack_qos_policy = strict_priority  # Stack 入口 QoS；可选 fcfs 或 strict_priority
host_response_queue_capacity = 0  # HostResponse 队列容量；0 表示无限，满时反压完成路径
transaction_response_queue_capacity = 0  # 子事务响应队列容量；0 表示无限，满时反压完成路径

[frontend]
pattern = stream  # 合成流量模式；可选 stream 或 random，使用 trace 时可由外部请求替代
requests = 10000  # 合成请求总数，可按仿真规模设为非负整数；trace 模式通常设为 0
read_ratio = 90  # 读请求比例，单位百分比，范围 0~100
seed = 11  # 随机流量种子；相同配置和种子可复现实验
random_address_space_bytes = 0  # random 聚合地址空间上限，单位 Byte；0 使用模型总容量
addr_stride = 64  # stream 模式相邻请求地址步长，单位 Byte，通常为 cache-line 大小
inject_interval = 1  # 普通请求注入间隔，单位 controller tick，越小表示注入越密集
init_sequence = none  # 启动控制序列；HBM 可选 none、auto、hbm、hbm3、hbm4
init_sequence_interval = 1  # 初始化控制命令之间的基础间隔，单位 controller tick
max_cycles = 100000000  # 仿真最大周期数；达到上限仍未完成时会报告 cycle-limit
progress_interval = 0  # 每 N 个 system cycle 向 stderr 打印进度；0 关闭

[controller]
read_buffer_size = 128  # 控制器读队列容量，单位事务条目，可按压力设置
write_buffer_size = 128  # 控制器写队列容量，单位事务条目，可按压力设置
priority_buffer_size = 4096  # 刷新、RFM 和控制命令优先队列容量，单位条目
write_low_watermark = 0.2  # 写排空低水位；写队列低于此比例且有待读请求时退出写优先阶段
write_high_watermark = 0.8  # 写排空高水位，与低水位满足 0≤low<high≤1；超过此比例或读队列为空时进入写优先

[controller.scheduler]
type = frfcfs  # 控制器调度算法；可选 fcfs 或 frfcfs，陌生名称会报错

[controller.row_policy]
type = open_page  # 行策略；可选 open_page、closed_page、closed_cap
cap = 4  # closed_cap 每次开行允许的数据列命令数上限，非仅 row-hit 次数，必须为正整数

[controller.addr_mapper]
address_mapping = default  # DRAM 地址映射模板；可选 default、RoBaRaCoCh、ChRaBaRoCo、RoCoRaBaCh
channel_mapper = xor  # 请求到 Channel 的分派；可选 decoded、round_robin、xor

[phy]
mode = behavioral  # Mem PHY 模式；可选 direct 或 behavioral
protocol = hbm  # PHY 协议族；HBM 配置使用 hbm，LPDDR 配置使用 lpddr
command_fifo_depth = 64  # Behavioral PHY 命令 FIFO 深度，单位条目
read_fifo_depth = 64  # Behavioral PHY 读返回 FIFO 深度，单位条目
write_fifo_depth = 64  # Behavioral PHY 写数据 FIFO 深度，单位条目
command_pipeline_cycles = 1  # PHY 命令流水线延迟，单位 nCK；内部乘 tick_multiplier 转为 controller tick
read_return_pipeline_cycles = 1  # PHY 读返回附加延迟，单位 nCK；不包含 DRAM RL
write_data_pipeline_cycles = 1  # PHY 写数据附加延迟，单位 nCK；不包含 DRAM WL
reset_cycles = 4  # PHY 复位持续时间，单位 nCK
initialization_cycles = 4  # PHY 初始化持续时间，单位 nCK
training_cycles = 8  # PHY 训练持续时间，单位 nCK
auto_train = true  # 是否经过 Training 阶段；false 跳过训练，复位/初始化仍自动推进到 Ready

[controller.refresh]
supports_refresh = true  # 是否启用刷新命令和调度；true 启用，false 关闭
refresh_policy = per_bank  # 刷新策略；per_bank/all_bank 为项目枚举，LPDDR6 非全 Bank 刷新使用 REFdb（双 Bank），标准无 REFpb
refresh_temperature_mode = normal  # 刷新温度档；可选 normal、high、extended
refresh_high_temp_multiplier = 2  # 高温刷新频率倍率，正整数；数值越大刷新间隔越短
refresh_postpone_limit = 0  # 允许推迟的刷新义务上限；0 表示禁止 postpone
refresh_pullin_limit = 0  # 允许提前执行的刷新次数上限；0 表示禁止 pull-in
refresh_credit_limit = 0  # 刷新 credit 绝对上限；0 表示不额外限制
rfm_policy = per_bank  # RFM 范围；可选 per_bank 或 all_bank
rfm_act_threshold = 256  # 触发 RFM 的 ACT/RAA 阈值，按研究或器件规则设置
rfm_decrement = 256  # RFM 完成后计数器递减量，按研究或器件规则设置
low_power_mode = off  # 低功耗模式；可选 off、power_down、self_refresh
low_power_entry_cycles = 0  # 控制器空闲低功耗入口门限，单位 nCK；不等同于向 PHY 显式发送 PDE/SREFEN
low_power_exit_cycles = 0  # 控制器退出 power-down 的恢复延迟，单位 nCK
self_refresh_exit_cycles = 0  # 控制器退出 self-refresh 的恢复延迟，单位 nCK

[storage]
backend = sparse  # 数据后端；可选 sparse、mmap_sparse、chunk_file
capacity_bytes = 0  # 各类存储后端的地址容量上限，单位 Byte；0 按模型几何容量计算，不代表宿主机预分配内存
chunk_size = 2097152  # chunk_file 后端块大小，单位 Byte，必须为正整数
chunk_cache_entries = 64  # chunk_file 内存缓存块数量，按宿主机内存预算设置
sparse_density_warning_pct = 1.0  # 稀疏后端分配密度告警阈值，单位百分比
topology_stats_scan_limit = 1000000  # 拓扑扫描工作量上限；sparse 按已分配 line，文件后端按逻辑 line；超限跳过整个扫描，0 不限
floorplan = true  # 是否派生 floorplan/tile/cell 坐标；true 启用，false 关闭
# subarrays_per_bank = 16  # 可选物理坐标研究参数；mats_per_subarray_x/y、cells_per_mat_x/y 等仍可覆盖

[reliability.payload]
ecc_shadow = true  # 是否启用 payload SECDED shadow；true 启用，false 关闭
ecc_check_on_read = true  # 是否在读取时检查 ECC shadow
ecc_correct_single_bit = true  # 是否自动纠正单比特错误

[reliability]
metadata_bits_per_request = 0  # 每个事务计入接口带宽的通用元数据位数
ecc_bits_per_request = 0  # 每个事务计入接口带宽的通用 ECC 位数

[fault_injection]
ecc_inject_period = 0  # ECC 故障注入周期；0 关闭，正整数表示每 N 次机会注入

[power]
enabled = true  # 是否启用当前 preset 的功耗模型；true 启用，false 关闭
source = configured_pj  # 计能方法；configured_pj 或 dramsim3_idd（IDD 公式），不会调用外部模拟器，也不代表器件校准
scale = 1.0  # 功耗统一缩放系数，1.0 表示不缩放
# power_read_pj = 340  # 可选研究覆盖，单位 pJ；其他 power_*/idd* 键仍支持，不能仅凭来源名称声称校准

[thermal]
enabled = true  # 是否启用当前 preset 的热模型；true 启用，false 关闭
ambient_c = 40  # 环境初始温度，单位摄氏度
cooling_per_cycle = 0.00025  # 每 tick 向环境冷却的比例系数
rise_c_per_pj = 0.00002  # 能量到温升的简化换算系数，单位 摄氏度/pJ
thermal_grid_cols_per_tile = 1  # 每个 floorplan tile 的热网格列数
thermal_grid_rows_per_tile = 1  # 每个 floorplan tile 的热网格行数
thermal_coupling = true  # 是否启用横向、纵向和 TSV 热耦合
lateral_coupling = 0.02  # 同层相邻热网格的耦合系数，建议范围 0~0.25
vertical_coupling = 0.012  # 相邻层热网格的基础耦合系数，建议范围 0~0.25
thermal_tsv_coupling_scale = 0.03  # TSV 通道对纵向热耦合的附加缩放系数
thermal_tsvs_per_grid = 4  # 每个热网格单元假设的 TSV 数量
thermal_chip_dim_x_m = 0.01  # 芯片/器件 X 方向物理尺寸，单位 m
thermal_chip_dim_y_m = 0.01  # 芯片/器件 Y 方向物理尺寸，单位 m
thermal_tsv_radius_m = 0.000005  # TSV 半径，单位 m
thermal_k_silicon = 148  # 硅材料导热系数，单位 W/(m·K)
thermal_k_copper = 401  # 铜材料导热系数，单位 W/(m·K)

[outputs]
stats_view = summary  # summary 为模型—参数—结果精简报告；专项诊断用 diagnostic
validate_cmd_trace = false  # 是否在运行结束后校验命令 trace；true 校验，false 跳过
validate_dfi_trace = false  # 是否在运行结束后校验 DFI trace；true 校验，false 跳过
fail_on_data_mismatch = true  # 读数据不匹配时是否返回失败退出码
# stats_json = outputs/my_run/result.json  # 完整版本化结果；独立于终端视图
# dump_resolved_config = outputs/my_run/resolved.cfg  # 精确生效值与派生依据（也可用 CLI --dump-resolved-config）

[standard.hbm3]
supports_ecc = false  # 标准/模式是否声明 ECC 能力；接口统计与 payload ECC 仍分别配置
supports_rfm = false  # 是否启用 RFM/PRAC 维护机制；true 启用，false 关闭
hbm_edge_pairing = true  # 是否启用 HBM 上升/下降沿命令配对
hbm_strict_edge_pairing = false  # 是否严格执行 HBM edge-pairing 矩阵
hbm_sid_interleave = false  # 是否允许 HBM SID 间交错调度
hbm_link_crc_mode = off  # HBM 链路 CRC 模式；当前实现 off、crc16
hbm_link_retry_enabled = false  # 是否启用 HBM 链路重试/重放行为入口

[standard.hbm3.organization]
stack_height = 8  # HBM Stack 的 DRAM die 层数，必须大于 0
data_rate_mbps = 6400  # 接口数据率，单位 Mb/s/pin
channels = 16  # 每个 Stack/器件实例的 Channel 数量，必须为正整数
pseudo_channels = 2  # 每 Channel 的 Pseudo-channel/Subchannel 数量
sids = auto  # HBM 4/8/12/16Hi 默认对应 1/2/3/4 SID；显式正整数可固定研究组织，容量中只乘一次
ranks = 1  # 每个 PC/SID 地址域的 Rank 数；HBM 使用统一模型占位层，标准 HBM 配置保持 1
bank_groups = 4  # 每个 PC/SID/Rank 地址域内的 Bank Group 数；不是每 die 总数；LPDDR6 当前配对实现要求偶数
banks_per_group = 4  # 每 Bank Group 的 Bank 数；与 PC/SID/Rank/BG 共同确定独立 Bank
rows = 16384  # 每 Bank 的 Row 数量，影响容量和地址解码
columns = 32  # 每 Bank Row 的事务槽数，一槽为 dram_transaction_bytes；参考模型列数需先按预取粒度换算
line_size = 64  # Host/frontend 请求粒度，单位 Byte
dram_transaction_bytes = 32  # HBM3 单 PC x32 BL8 事务为 32B；一个 64B host line 拆成两个事务

[standard.hbm4]
supports_ecc = true  # 标准/模式是否声明 ECC 能力；接口统计与 payload ECC 仍分别配置
supports_rfm = true  # 是否启用 RFM/PRAC 维护机制；true 启用，false 关闭
hbm_edge_pairing = true  # 是否启用 HBM 上升/下降沿命令配对
hbm_strict_edge_pairing = true  # 是否严格执行 HBM edge-pairing 矩阵
hbm_sid_interleave = true  # 是否允许 HBM SID 间交错调度
hbm_link_crc_mode = off  # HBM 链路 CRC 模式；当前实现 off、crc16
hbm_link_retry_enabled = false  # 是否启用 HBM 链路重试/重放行为入口
hbm_ecc_bits_per_request = 16  # 每个 HBM 事务计入接口带宽的 ECC 位数
hbm_link_crc_bits_per_request = 0  # 每个 HBM 事务计入接口带宽的 CRC 位数
hbm_ras_metadata_bits_per_request = 0  # 每个 HBM 事务计入接口带宽的 RAS 元数据位数

[standard.hbm4.organization]
stack_height = 8  # HBM Stack 的 DRAM die 层数，必须大于 0
data_rate_mbps = 8000  # 接口数据率，单位 Mb/s/pin
channels = 32  # 每个 Stack/器件实例的 Channel 数量，必须为正整数
pseudo_channels = 2  # 每 Channel 的 Pseudo-channel/Subchannel 数量
sids = auto  # HBM 4/8/12/16Hi 默认对应 1/2/3/4 SID；显式正整数可固定研究组织，容量中只乘一次
ranks = 1  # 每个 PC/SID 地址域的 Rank 数；HBM 使用统一模型占位层，标准 HBM 配置保持 1
bank_groups = 2  # 每个 PC/SID/Rank 地址域内的 Bank Group 数；ranks=1 时每 PC 的 BG 总数为 SID×本值，8Hi 基准为 2×2=4
banks_per_group = 8  # 每 Bank Group 的 Bank 数；与 PC/SID/Rank/BG 共同确定独立 Bank
rows = 16384  # 每 Bank 的 Row 数量，影响容量和地址解码
columns = 32  # 每行 32 个事务槽；当前 HBM4 BL8 组织中与 CA[4:0] 一一对应，每槽 32B
line_size = 64  # Host/frontend 请求粒度，单位 Byte
dram_transaction_bytes = 32  # 单条 DRAM 事务 payload，单位 Byte；0 表示按 line_size 推导

[dram.timing]
source = research_default  # 自定义 Timing 默认是研究数据；不会自动变成 vendor
# nCL = 30  # 仅演示显式覆盖语法，不声明基准或 JEDEC 推荐 RL，单位 nCK；修改时需核对目标 RL
# tRCD_RD_ns = 15  # 可选时间制输入，按最终 CK 向上取整；不要同时填写同一约束的 nCK 和 ns
# 修改清单见 文档/cfg指南.md 3.6.12：独立输入、单位换算、自动补推和不会联动的项。
# 未填项采用基准；普通 Timing 不支持 auto。后面的 [override] 显式值优先于本段。
# source 只声明来源，不是自动推导开关；DFI/PHY 参数另见指南 3.4。

[audit]
vendor_profile = generic  # 来源标签，不代表已校准；只有显式 Timing 来源及证据可声明 vendor
dfi_version = 6.0.1  # 接口语义参考标签，不表示引脚级或 DFI 一致性认证

[override]
# 复制本文件、选择 base_standard、修改上方当前标准的参数即可；也可在此集中写实验差异。
# 缺省/auto 联动项：speed_bin_mbps、tCK_ps、density_gb、data_bus_bits；不必重复填写。
# 容量 = Channel×PC×SID×Rank×BG×Bank×Row×事务Column×事务Byte；不能再乘 stack_height。
# HBM density 按几何容量/stack_height 得到每 die Gibit；LPDDR 按每 subchannel/rank 计算。
# 存储后端 capacity_bytes=0 跟随几何容量，实际宿主机占用取决于后端与访问量。
# 保留全部已实现高级键；陌生调度器/后端、矛盾数值和溢出会报错，不会静默回退。
# nCL = 28  # 仅演示显式覆盖语法，不声明基准或 JEDEC 推荐 RL；本段优先于 [dram.timing]，不代表自动校准

# 此副本的实验覆盖；主参数推导规则与主模板相同。
model_name = hbm_two_stack_demo  # 结果中的示例模型名称
validation_mode = exploratory  # 示例用于软件流程和架构研究
stack_count = 2  # 两颗独立 HBM Stack，可由 CLI 扩展
stack_mapping = interleaved  # 以固定条带轮转 Stack
stack_interleave_bytes = 256  # Stack 地址条带，单位 Byte
stack_ingress_buffer_size = 256  # 每 Stack 入口队列深度
stack_dispatch_width = 4  # 每 Stack 每 system tick 最大分发数
stack_qos_policy = strict_priority  # 入口优先比较 QoS
requests = 4096  # 合成 HostRequest 数量
pattern = random  # 展开多 Stack/channel/bank 的随机流量
read_ratio = 80  # 读请求比例，单位百分比
seed = 11  # 固定种子以便重放
inject_interval = 1  # 请求注入间隔，单位 controller tick
mem_phy_mode = behavioral  # 每个 [stack][channel] 使用独立行为级 PHY
memory_backend = sparse  # 每 Stack 使用独立稀疏后端
floorplan = true  # 每 Stack 派生独立物理坐标
power_model = true  # 分 Stack 累计行为级功耗
thermal_model = true  # 分 Stack 维护行为级热状态
validate_cmd_trace = true  # 结束时校验所有 Stack 的 command trace
validate_dfi_trace = true  # 结束时校验所有 Stack 的 DFI trace
