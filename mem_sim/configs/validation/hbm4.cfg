# HBM4 验证参数集。native preset 检查本项目完整路径，Ramulator2 preset 对齐共同抽象面。

[meta]
schema_version = 3  # 验证夹具同样使用最新联动规则；密度从实际测试几何推导，不代表完整参考器件
extends = ../hbm.cfg  # 继承 HBM3/HBM4 标准主配置；相对本文件目录解析

[model]
name = hbm4_validation  # 验证运行的默认实例名称
base_standard = hbm4  # 本验证集固定选择 HBM4 协议语义

[preset.hbm4.validation_native_1ch.organization]
model_name = hbm4_project_native_1ch  # 模型实例名称，仅用于标识和审计，可自行命名
timing_profile = hbm4_project_native_8000_32gb_8hi  # Timing/组织 profile 名称，用于结果标识和来源审计
mode_profile = project_native_validation  # 工作模式名称，用于区分速率、保护、DVFS 等参数组合
channels = 1  # 每个 Stack/器件实例的 Channel 数量，必须为正整数
line_size = 32  # Host/frontend 请求粒度，单位 Byte
dram_transaction_bytes = 32  # 单条 DRAM 事务 payload，单位 Byte；0 表示按 line_size 推导
data_bus_bits = 64  # 一个存储实例的接口总数据位宽，单位 bit
hbm_full_32_channel_stack = false  # 完整 HBM4 Stack 的声明标签；不会自动设置 channels/SID/rows，实际组织由 organization 决定
supports_refresh = false  # 是否启用刷新命令和调度；true 启用，false 关闭
supports_rfm = false  # 是否启用 RFM/PRAC 维护机制；true 启用，false 关闭
single_controller = true  # 是否强制单控制器验证口径；true 启用，false 使用完整系统
read_buffer_size = 16384  # 控制器读队列容量，单位事务条目，可按压力设置
write_buffer_size = 16384  # 控制器写队列容量，单位事务条目，可按压力设置
priority_buffer_size = 64  # 刷新、RFM 和控制命令优先队列容量，单位条目
requests = 0  # 合成请求总数，可按仿真规模设为非负整数；trace 模式通常设为 0
read_ratio = 100  # 读请求比例，单位百分比，范围 0~100
seed = 1  # 随机流量种子；相同配置和种子可复现实验
inject_interval = 0  # 普通请求注入间隔，单位 controller tick，越小表示注入越密集
max_cycles = 2000000  # 仿真最大周期数；达到上限仍未完成时会报告 cycle-limit
channel_mapper = decoded  # 请求到 Channel 的分派；可选 decoded、round_robin、xor
mem_phy_mode = direct  # Mem PHY 模式；可选 direct 或 behavioral
dfi_version = 6.0.1  # DFI-oriented 行为模型的版本标签，仅用于接口语义和审计
phy_command_fifo_depth = 16  # preset 覆盖的 PHY 命令 FIFO 深度，单位条目
phy_read_fifo_depth = 16  # preset 覆盖的 PHY 读返回 FIFO 深度，单位条目
phy_write_fifo_depth = 16  # preset 覆盖的 PHY 写数据 FIFO 深度，单位条目
phy_reset_cycles = 0  # PHY 复位持续时间，单位 nCK
phy_initialization_cycles = 0  # PHY 初始化持续时间，单位 nCK
phy_training_cycles = 0  # PHY 训练持续时间，单位 nCK
dfi_phase_count = 2  # 行为 trace 相位编号周期，phase=tick%phase_count；0 取 tick_multiplier，不代表完整 DFI 频率比实现
dfi_data_lane_bytes = 16  # 每个 DFI 数据 beat 的字节数；0 表示按事务和突发参数推导
dfi_read_latency_nck = 30  # DFI 读数据返回延迟，单位 nCK；0 表示使用模型推导值
dfi_write_latency_nck = 10  # DFI 写数据对齐延迟，单位 nCK；0 表示使用模型推导值
memory_backend = sparse  # preset 覆盖的数据后端；可选 sparse、mmap_sparse、chunk_file
memory_chunk_cache_entries = 16  # preset 覆盖的 chunk_file 缓存块数量
sparse_density_warning_pct = 30  # 稀疏后端分配密度告警阈值，单位百分比
topology_stats_scan_limit = 100000  # 拓扑扫描工作量上限；sparse 按已分配 line，文件后端按逻辑 line；超限跳过整个扫描，0 不限
power_model = false  # 是否启用功耗事件模型；true 启用，false 关闭
thermal_model = false  # 是否启用热模型；true 启用，false 关闭
ecc_shadow = true  # 是否启用 payload SECDED shadow；true 启用，false 关闭
ecc_check_on_read = true  # 是否在读取时检查 ECC shadow

[preset.hbm4.ramulator2_reference_1ch.organization]
model_name = hbm4_ramulator2_reference_1ch  # 模型实例名称，仅用于标识和审计，可自行命名
timing_profile = hbm4_ramulator2_8000_32gb_8hi  # Timing/组织 profile 名称，用于结果标识和来源审计
vendor_profile = ramulator2_baseline  # 参考来源审计标签；Ramulator/DRAMsim3 不是厂商器件校准数据
mode_profile = differential_single_channel  # 工作模式名称，用于区分速率、保护、DVFS 等参数组合
channels = 1  # 每个 Stack/器件实例的 Channel 数量，必须为正整数
line_size = 32  # Host/frontend 请求粒度，单位 Byte
dram_transaction_bytes = 32  # 单条 DRAM 事务 payload，单位 Byte；0 表示按 line_size 推导
data_bus_bits = 64  # 一个存储实例的接口总数据位宽，单位 bit
hbm_full_32_channel_stack = false  # 完整 HBM4 Stack 的声明标签；不会自动设置 channels/SID/rows，实际组织由 organization 决定
supports_refresh = false  # 是否启用刷新命令和调度；true 启用，false 关闭
supports_rfm = false  # 是否启用 RFM/PRAC 维护机制；true 启用，false 关闭
supports_ecc = false  # 标准/模式是否声明 ECC 能力；接口统计与 payload ECC 仍分别配置
single_controller = true  # 是否强制单控制器验证口径；true 启用，false 使用完整系统
read_buffer_size = 16384  # 控制器读队列容量，单位事务条目，可按压力设置
write_buffer_size = 16384  # 控制器写队列容量，单位事务条目，可按压力设置
priority_buffer_size = 64  # 刷新、RFM 和控制命令优先队列容量，单位条目
requests = 0  # 合成请求总数，可按仿真规模设为非负整数；trace 模式通常设为 0
read_ratio = 100  # 读请求比例，单位百分比，范围 0~100
seed = 1  # 随机流量种子；相同配置和种子可复现实验
inject_interval = 0  # 普通请求注入间隔，单位 controller tick，越小表示注入越密集
max_cycles = 2000000  # 仿真最大周期数；达到上限仍未完成时会报告 cycle-limit
channel_mapper = decoded  # 请求到 Channel 的分派；可选 decoded、round_robin、xor
mem_phy_mode = direct  # Mem PHY 模式；可选 direct 或 behavioral
dfi_version = 6.0.1  # DFI-oriented 行为模型的版本标签，仅用于接口语义和审计
phy_command_fifo_depth = 16  # preset 覆盖的 PHY 命令 FIFO 深度，单位条目
phy_read_fifo_depth = 16  # preset 覆盖的 PHY 读返回 FIFO 深度，单位条目
phy_write_fifo_depth = 16  # preset 覆盖的 PHY 写数据 FIFO 深度，单位条目
phy_reset_cycles = 0  # PHY 复位持续时间，单位 nCK
phy_initialization_cycles = 0  # PHY 初始化持续时间，单位 nCK
phy_training_cycles = 0  # PHY 训练持续时间，单位 nCK
dfi_phase_count = 2  # 行为 trace 相位编号周期，phase=tick%phase_count；0 取 tick_multiplier，不代表完整 DFI 频率比实现
dfi_data_lane_bytes = 16  # 每个 DFI 数据 beat 的字节数；0 表示按事务和突发参数推导
dfi_read_latency_nck = 20  # DFI 读数据返回延迟，单位 nCK；0 表示使用模型推导值
dfi_write_latency_nck = 10  # DFI 写数据对齐延迟，单位 nCK；0 表示使用模型推导值
floorplan = false  # 是否派生 floorplan/tile/cell 坐标；true 启用，false 关闭
power_model = false  # 是否启用功耗事件模型；true 启用，false 关闭
thermal_model = false  # 是否启用热模型；true 启用，false 关闭
memory_chunk_cache_entries = 16  # preset 覆盖的 chunk_file 缓存块数量
sparse_density_warning_pct = 30  # 稀疏后端分配密度告警阈值，单位百分比
topology_stats_scan_limit = 100000  # 拓扑扫描工作量上限；sparse 按已分配 line，文件后端按逻辑 line；超限跳过整个扫描，0 不限
ecc_shadow = false  # 是否启用 payload SECDED shadow；true 启用，false 关闭
ecc_check_on_read = false  # 是否在读取时检查 ECC shadow

[preset.hbm4.ramulator2_reference_1ch.timing_reference]
source = external_reference  # Timing 来源标签；可选 jedec、vendor、external_reference、research_default、derived
reference = Ramulator2.1 HBM4 8000 common-surface differential timing; not device data.  # 该 Timing 参数组的来源说明，用于审计和声明边界
nBL = 2  # 突发占用长度，单位 nCK
nCL = 20  # 读命令到数据返回的 CAS latency，单位 nCK
nCWL = 10  # 写命令到写数据的 CAS write latency，单位 nCK
nRCDRD = 39  # 激活到读命令的最小间隔，单位 nCK
nRCDWR = 19  # 激活到写命令的最小间隔，单位 nCK
nRP = 33  # 单 Bank 预充电恢复时间，单位 nCK
nRPab = 33  # 全 Bank 预充电恢复时间，单位 nCK
nRAS = 57  # Row 保持激活的最短时间，单位 nCK
nRC = 90  # 同 Bank Row cycle 最小周期，单位 nCK
nRTP = 12  # 读到预充电的最小间隔，单位 nCK
nWR = 42  # 写恢复时间，单位 nCK
nCCDS = 2  # 短列命令间隔，单位 nCK
nCCDL = 4  # 同 Bank Group 长列命令间隔，单位 nCK
nCCDR = 2  # HBM 不同 SID 连续读间隔，单位 nCK
nRRDS = 5  # 短 ACT-to-ACT 间隔，单位 nCK
nRRDL = 7  # 长 ACT-to-ACT 间隔，单位 nCK
nFAW = 30  # 四次激活窗口宽度，单位 nCK
nRTW = 25  # 读转写总线换向间隔，单位 nCK
nWTRS = 9  # 不同 BG 写数据突发后的读恢复项，单位 nCK；WR→RD 还包含 WL 和 burst
nWTRL = 13  # 同 BG 写数据突发后的读恢复项，单位 nCK；WR→RD 还包含 WL 和 burst
nPPD = 2  # 连续 PRE 命令最小间隔，单位 nCK
nRFC = 900  # 全 Bank refresh recovery，单位 nCK
nRFCpb = 560  # 单/双 Bank refresh recovery，单位 nCK
nRFMab = 900  # 全 Bank RFM recovery，单位 nCK
nRFMpb = 560  # 单 Bank RFM recovery，单位 nCK
nRREFD = 16  # 刷新相关最小命令间隔，单位 nCK
nREFI = 7800  # 全 Bank 刷新平均间隔，单位 nCK
nREFIpb = 244  # 单/双 Bank 刷新调度间隔，单位 nCK
