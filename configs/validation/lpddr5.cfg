# LPDDR5 验证参数集。标准行为继承 lpddr.cfg，本文件保存 Ramulator2 共同面条件。

[meta]
schema_version = 3  # 验证夹具同样使用最新联动规则；密度从实际测试几何推导，不代表完整参考器件
extends = ../lpddr.cfg  # 继承 LPDDR5/LPDDR6 标准主配置；相对本文件目录解析

[model]
name = lpddr5_validation  # 验证运行的默认实例名称
base_standard = lpddr5  # 本验证集固定选择 LPDDR5 协议语义

[preset.lpddr5.ramulator2_reference_1ch.organization]
model_name = lpddr5_ramulator2_reference_1ch  # 模型实例名称，仅用于标识和审计，可自行命名
vendor_profile = ramulator2_baseline  # 参考来源审计标签；Ramulator/DRAMsim3 不是厂商器件校准数据
mode_profile = default  # 工作模式名称，用于区分速率、保护、DVFS 等参数组合
channels = 1  # 每个 Stack/器件实例的 Channel 数量，必须为正整数
pseudo_channels = 1  # 每 Channel 的 Sub-Channel 数；pseudo_channels 是项目复用键名
sids = 1  # 统一模型的 SID 占位维度；标准 LPDDR 保持 1，不表示 HBM 式堆叠 SID
line_size = 32  # Host/frontend 请求粒度，单位 Byte
dram_transaction_bytes = 32  # 单条 DRAM 事务 payload，单位 Byte；0 表示按 line_size 推导
columns = 64  # 每行 64 个 32B 事务槽；Ramulator 原始 column=1024 除以预取 16，行容量 2KiB
data_bus_bits = 16  # 一个存储实例的接口总数据位宽，单位 bit
lpddr_wck_mode = cas_sync  # LPDDR WCK 模式；当前实现 cas_sync、always_on
supports_refresh = false  # 是否启用刷新命令和调度；true 启用，false 关闭
supports_rfm = false  # 是否启用 RFM/PRAC 维护机制；true 启用，false 关闭
supports_ecc = false  # 标准/模式是否声明 ECC 能力；接口统计与 payload ECC 仍分别配置
single_controller = true  # 是否强制单控制器验证口径；true 启用，false 使用完整系统
read_buffer_size = 32  # 控制器读队列容量，单位事务条目，可按压力设置
write_buffer_size = 32  # 控制器写队列容量，单位事务条目，可按压力设置
priority_buffer_size = 2048  # 刷新、RFM 和控制命令优先队列容量，单位条目
requests = 0  # 合成请求总数，可按仿真规模设为非负整数；trace 模式通常设为 0
read_ratio = 100  # 读请求比例，单位百分比，范围 0~100
seed = 1  # 随机流量种子；相同配置和种子可复现实验
inject_interval = 0  # 普通请求注入间隔，单位 controller tick，越小表示注入越密集
max_cycles = 2000000  # 仿真最大周期数；达到上限仍未完成时会报告 cycle-limit
mem_phy_mode = direct  # Mem PHY 模式；可选 direct 或 behavioral
dfi_version = 6.0.1  # DFI-oriented 行为模型的版本标签，仅用于接口语义和审计
phy_command_fifo_depth = 16  # preset 覆盖的 PHY 命令 FIFO 深度，单位条目
phy_read_fifo_depth = 16  # preset 覆盖的 PHY 读返回 FIFO 深度，单位条目
phy_write_fifo_depth = 16  # preset 覆盖的 PHY 写数据 FIFO 深度，单位条目
phy_reset_cycles = 0  # PHY 复位持续时间，单位 nCK
phy_initialization_cycles = 0  # PHY 初始化持续时间，单位 nCK
phy_training_cycles = 0  # PHY 训练持续时间，单位 nCK
rfm_act_threshold = 0  # 触发 RFM 的 ACT/RAA 阈值，按研究或器件规则设置
rfm_decrement = 0  # RFM 完成后计数器递减量，按研究或器件规则设置
lpddr_dvfs_mode = nominal  # LPDDR DVFS 档；可选 nominal、low、disabled
lpddr_low_data_rate_mbps = 3200  # LPDDR 低 DVFS 档数据率，单位 Mb/s/pin
floorplan = false  # 是否派生 floorplan/tile/cell 坐标；true 启用，false 关闭
power_model = false  # 是否启用功耗事件模型；true 启用，false 关闭
thermal_model = false  # 是否启用热模型；true 启用，false 关闭
memory_chunk_cache_entries = 16  # preset 覆盖的 chunk_file 缓存块数量
sparse_density_warning_pct = 30  # 稀疏后端分配密度告警阈值，单位百分比
topology_stats_scan_limit = 100000  # 拓扑扫描工作量上限；sparse 按已分配 line，文件后端按逻辑 line；超限跳过整个扫描，0 不限
ecc_shadow = true  # 是否启用 payload SECDED shadow；true 启用，false 关闭
ecc_check_on_read = true  # 是否在读取时检查 ECC shadow

[preset.lpddr5.ramulator2_reference_1ch.timing_reference]
source = external_reference  # Timing 来源标签；可选 jedec、vendor、external_reference、research_default、derived
reference = Ramulator2.1 LPDDR5 x16 common-surface differential timing.  # 该 Timing 参数组的来源说明，用于审计和声明边界
nECCSCRUB = 0  # ECC scrub 控制操作持续时间，单位 nCK
nRASERR = 0  # RAS 错误处理操作持续时间，单位 nCK
nLINKRETRY = 0  # 链路 retry/replay 阻塞时间，单位 nCK
