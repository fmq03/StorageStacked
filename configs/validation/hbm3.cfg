# HBM3 验证参数集。只保存与外部模型对齐或受控验证所需的差异，标准参数继承 hbm.cfg。

[meta]
schema_version = 3  # 验证夹具同样使用最新联动规则；密度从实际测试几何推导，不代表完整参考器件
extends = ../hbm.cfg  # 继承 HBM3/HBM4 标准主配置；相对本文件目录解析

[model]
name = hbm3_validation  # 验证运行的默认实例名称
base_standard = hbm3  # 本验证集固定选择 HBM3 协议语义

[preset.hbm3.ramulator2_reference_1ch.organization]
model_name = hbm3_ramulator2_reference_1ch  # 模型实例名称，仅用于标识和审计，可自行命名
vendor_profile = ramulator2_baseline  # 参考来源审计标签；Ramulator/DRAMsim3 不是厂商器件校准数据
mode_profile = default  # 工作模式名称，用于区分速率、保护、DVFS 等参数组合
channels = 1  # 每个 Stack/器件实例的 Channel 数量，必须为正整数
line_size = 32  # Host/frontend 请求粒度，单位 Byte
dram_transaction_bytes = 32  # 单条 DRAM 事务 payload，单位 Byte；0 表示按 line_size 推导
data_bus_bits = 64  # 一个存储实例的接口总数据位宽，单位 bit
hbm_full_32_channel_stack = false  # 完整 HBM4 Stack 的声明标签；不会自动设置 channels/SID/rows，实际组织由 organization 决定
hbm_sid_interleave = true  # 是否允许 HBM SID 间交错调度
hbm_pc_interleave = true  # PC 交错的声明标签；当前不作为调度器开关
hbm_strict_edge_pairing = true  # 是否严格执行 HBM edge-pairing 矩阵
supports_refresh = false  # 是否启用刷新命令和调度；true 启用，false 关闭
supports_rfm = false  # 是否启用 RFM/PRAC 维护机制；true 启用，false 关闭
supports_ecc = false  # 标准/模式是否声明 ECC 能力；接口统计与 payload ECC 仍分别配置
single_controller = true  # 是否强制单控制器验证口径；true 启用，false 使用完整系统
scheduler = frfcfs  # 控制器调度算法；可选 fcfs 或 frfcfs，陌生名称会报错
row_policy = open_page  # 行策略；可选 open_page、closed_page、closed_cap
address_mapping = default  # DRAM 地址映射模板；可选 default、RoBaRaCoCh、ChRaBaRoCo、RoCoRaBaCh
channel_mapper = decoded  # 请求到 Channel 的分派；可选 decoded、round_robin、xor
read_buffer_size = 32  # 控制器读队列容量，单位事务条目，可按压力设置
write_buffer_size = 32  # 控制器写队列容量，单位事务条目，可按压力设置
priority_buffer_size = 2048  # 刷新、RFM 和控制命令优先队列容量，单位条目
requests = 0  # 合成请求总数，可按仿真规模设为非负整数；trace 模式通常设为 0
read_ratio = 100  # 读请求比例，单位百分比，范围 0~100
seed = 1  # 随机流量种子；相同配置和种子可复现实验
inject_interval = 0  # 普通请求注入间隔，单位 controller tick，越小表示注入越密集
max_cycles = 2000000  # 仿真最大周期数；达到上限仍未完成时会报告 cycle-limit
mem_phy_mode = direct  # Mem PHY 模式；可选 direct 或 behavioral
dfi_version = 6.0.1  # DFI-oriented 行为模型的版本标签，仅用于接口语义和审计
phy_command_fifo_depth = 16  # preset 覆盖的 PHY 命令 FIFO 深度，单位条目
phy_read_fifo_depth = 16  # preset 覆盖的 PHY 读返回 FIFO 深度，单位条目
phy_write_fifo_depth = 16  # preset 覆盖的 PHY 写数据 FIFO 深度，单位条目
phy_reset_cycles = 0  # PHY 复位持续时间，单位 nCK
phy_initialization_cycles = 0  # PHY 初始化持续时间，单位 nCK
phy_training_cycles = 0  # PHY 训练持续时间，单位 nCK
rfm_act_threshold = 0  # 触发 RFM 的 ACT/RAA 阈值，按研究或器件规则设置
rfm_decrement = 0  # RFM 完成后计数器递减量，按研究或器件规则设置
floorplan = false  # 是否派生 floorplan/tile/cell 坐标；true 启用，false 关闭
power_model = false  # 是否启用功耗事件模型；true 启用，false 关闭
thermal_model = false  # 是否启用热模型；true 启用，false 关闭
memory_chunk_cache_entries = 16  # preset 覆盖的 chunk_file 缓存块数量
sparse_density_warning_pct = 30  # 稀疏后端分配密度告警阈值，单位百分比
topology_stats_scan_limit = 100000  # 拓扑扫描工作量上限；sparse 按已分配 line，文件后端按逻辑 line；超限跳过整个扫描，0 不限
ecc_shadow = true  # 是否启用 payload SECDED shadow；true 启用，false 关闭
ecc_check_on_read = true  # 是否在读取时检查 ECC shadow

[preset.hbm3.ramulator2_reference_1ch.timing_reference]
source = external_reference  # 仅此验证 preset 采用完整参考器件的时序，不改变单通道几何密度
reference = Ramulator2 HBM3 6400 16Gb 8Hi nRFC at CK=625ps  # 外部对照来源；不是缩减几何的厂商刷新校准
nRFC = 560  # 外部参考 nRFC=350ns/625ps；HBM tick_multiplier=2 时为 1120 tick

[preset.hbm3.dramsim3_hbm2_common.organization]
model_name = dramsim3_hbm2_common_abstraction  # 模型实例名称，仅用于标识和审计，可自行命名
timing_profile = dramsim3_hbm2_common_abstraction  # Timing/组织 profile 名称，用于结果标识和来源审计
vendor_profile = dramsim3_reference  # 参考来源审计标签；Ramulator/DRAMsim3 不是厂商器件校准数据
mode_profile = older_hbm_common_surface  # 工作模式名称，用于区分速率、保护、DVFS 等参数组合
stack_height = 4  # 对齐 DRAMsim3 HBM2_4Gb_x128 的 num_dies；执行协议仍是项目 HBM3 共同命令抽象
data_rate_mbps = 4000  # 按本模型 HBM 的 4e6/rate 时间基得到 1000 ps；不是声明 HBM2 器件数据率
tCK_ps = 1000  # DRAM 时钟周期，单位 ps；改变速率时需同步校准 Timing
tick_multiplier = 1  # 每个 nCK 划分的 controller tick 数；HBM 边沿模型通常为 2
channels = 1  # 每个 Stack/器件实例的 Channel 数量，必须为正整数
pseudo_channels = 1  # 每 Channel 的 Pseudo-channel/Subchannel 数量
sids = 1  # 每个 PC 下独立寻址的 SID 数量；不直接等于 die 数，容量中只乘一次
ranks = 1  # 每个 PC/SID 地址域的 Rank 数；HBM 使用统一模型占位层，标准 HBM 配置保持 1
bank_groups = 4  # 每个 PC/SID/Rank 地址域内的 Bank Group 数；不是每 die 总数；LPDDR6 当前配对实现要求偶数
banks_per_group = 4  # 每 Bank Group 的 Bank 数；与 PC/SID/Rank/BG 共同确定独立 Bank
rows = 16384  # 每 Bank 的 Row 数量，影响容量和地址解码
columns = 32  # DRAMsim3 HBM 原始 columns=64 经 ×2/BL4 转为 32 个 64B 事务槽，行容量 2KiB
line_size = 64  # Host/frontend 请求粒度，单位 Byte
dram_transaction_bytes = 64  # 单条 DRAM 事务 payload，单位 Byte；0 表示按 line_size 推导
data_bus_bits = 128  # 一个存储实例的接口总数据位宽，单位 bit
prefetch_size = 4  # 历史预取/突发描述值（无量纲）；当前主要用于身份审计，不自动改变事务字节数或 nBL
hbm_full_32_channel_stack = false  # 完整 HBM4 Stack 的声明标签；不会自动设置 channels/SID/rows，实际组织由 organization 决定
hbm_sid_interleave = false  # 是否允许 HBM SID 间交错调度
hbm_pc_interleave = false  # PC 交错的声明标签；当前不作为调度器开关
hbm_edge_pairing = false  # 是否启用 HBM 上升/下降沿命令配对
supports_refresh = false  # 是否启用刷新命令和调度；true 启用，false 关闭
supports_rfm = false  # 是否启用 RFM/PRAC 维护机制；true 启用，false 关闭
supports_ecc = false  # 标准/模式是否声明 ECC 能力；接口统计与 payload ECC 仍分别配置
single_controller = true  # 是否强制单控制器验证口径；true 启用，false 使用完整系统
read_ratio = 100  # 读请求比例，单位百分比，范围 0~100
seed = 1  # 随机流量种子；相同配置和种子可复现实验
inject_interval = 0  # 普通请求注入间隔，单位 controller tick，越小表示注入越密集
read_buffer_size = 32  # 控制器读队列容量，单位事务条目，可按压力设置
write_buffer_size = 32  # 控制器写队列容量，单位事务条目，可按压力设置
priority_buffer_size = 2048  # 刷新、RFM 和控制命令优先队列容量，单位条目
channel_mapper = decoded  # 请求到 Channel 的分派；可选 decoded、round_robin、xor
max_cycles = 10000000  # 仿真最大周期数；达到上限仍未完成时会报告 cycle-limit
mem_phy_mode = direct  # Mem PHY 模式；可选 direct 或 behavioral
dfi_version = 6.0.1  # DFI-oriented 行为模型的版本标签，仅用于接口语义和审计
phy_command_fifo_depth = 16  # preset 覆盖的 PHY 命令 FIFO 深度，单位条目
phy_read_fifo_depth = 16  # preset 覆盖的 PHY 读返回 FIFO 深度，单位条目
phy_write_fifo_depth = 16  # preset 覆盖的 PHY 写数据 FIFO 深度，单位条目
phy_reset_cycles = 0  # PHY 复位持续时间，单位 nCK
phy_initialization_cycles = 0  # PHY 初始化持续时间，单位 nCK
phy_training_cycles = 0  # PHY 训练持续时间，单位 nCK
rfm_act_threshold = 0  # 触发 RFM 的 ACT/RAA 阈值，按研究或器件规则设置
rfm_decrement = 0  # RFM 完成后计数器递减量，按研究或器件规则设置
hbm_strict_edge_pairing = true  # 是否严格执行 HBM edge-pairing 矩阵
memory_chunk_cache_entries = 16  # preset 覆盖的 chunk_file 缓存块数量
sparse_density_warning_pct = 30  # 稀疏后端分配密度告警阈值，单位百分比
topology_stats_scan_limit = 100000  # 拓扑扫描工作量上限；sparse 按已分配 line，文件后端按逻辑 line；超限跳过整个扫描，0 不限
floorplan = true  # 是否派生 floorplan/tile/cell 坐标；true 启用，false 关闭
power_model = true  # 是否启用功耗事件模型；true 启用，false 关闭
thermal_model = true  # 是否启用热模型；true 启用，false 关闭
power_source = dramsim3_idd  # 计能方法；configured_pj 或 dramsim3_idd（IDD 公式），不会调用外部模拟器，也不代表器件校准
thermal_ambient_c = 40  # preset 覆盖的环境初始温度，单位摄氏度
thermal_chip_dim_x_m = 0.008  # 芯片/器件 X 方向物理尺寸，单位 m
thermal_chip_dim_y_m = 0.008  # 芯片/器件 Y 方向物理尺寸，单位 m
idd_burst_cycles = 2  # IDD burst 计能持续周期；0 表示按命令/Timing 自动推导

[preset.hbm3.dramsim3_hbm2_common.timing_reference]
source = external_reference  # Timing 来源标签；可选 jedec、vendor、external_reference、research_default、derived
reference = DRAMsim3 HBM2 common-command/IDD abstraction using HBM3 executable semantics.  # 该 Timing 参数组的来源说明，用于审计和声明边界
nBL = 2  # 突发占用长度，单位 nCK
nCL = 14  # 读命令到数据返回的 CAS latency，单位 nCK
nCWL = 4  # 写命令到写数据的 CAS write latency，单位 nCK
nRCDRD = 14  # 激活到读命令的最小间隔，单位 nCK
nRCDWR = 14  # 激活到写命令的最小间隔，单位 nCK
nRP = 14  # 单 Bank 预充电恢复时间，单位 nCK
nRAS = 34  # Row 保持激活的最短时间，单位 nCK
nRC = 48  # 同 Bank Row cycle 最小周期，单位 nCK
nRTP = 4  # 读到预充电的最小间隔，单位 nCK
nWR = 16  # 写恢复时间，单位 nCK
nCCDS = 1  # 短列命令间隔，单位 nCK
nCCDL = 2  # 同 Bank Group 长列命令间隔，单位 nCK
nCCDR = 2  # HBM 不同 SID 连续读间隔，单位 nCK
nRRDS = 4  # 短 ACT-to-ACT 间隔，单位 nCK
nRRDL = 6  # 长 ACT-to-ACT 间隔，单位 nCK
nFAW = 30  # 四次激活窗口宽度，单位 nCK
nWTRS = 6  # 不同 BG 写数据突发后的读恢复项，单位 nCK；WR→RD 还包含 WL 和 burst
nWTRL = 8  # 同 BG 写数据突发后的读恢复项，单位 nCK；WR→RD 还包含 WL 和 burst
nRTW = 16  # 读转写总线换向间隔，单位 nCK
nRFC = 260  # 全 Bank refresh recovery，单位 nCK
nRFCpb = 260  # 单/双 Bank refresh recovery，单位 nCK
nRREFD = 13  # 刷新相关最小命令间隔，单位 nCK
nREFI = 3900  # 全 Bank 刷新平均间隔，单位 nCK
nREFIpb = 128  # 单/双 Bank 刷新调度间隔，单位 nCK
